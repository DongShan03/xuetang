name: SunsetBot Haidian Data Proxy

on:
  schedule:
    # Beijing time 08:50 and 20:50
    - cron: '50 0,12 * * *'
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/sunsetbot_probe.yml'
      - 'sunsetbot_probe_trigger.txt'

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Query SunsetBot detailed API
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import random
          from datetime import datetime, timedelta
          from zoneinfo import ZoneInfo

          import requests

          base = 'https://sunsetbot.top/detailed/'
          headers = {
              'User-Agent': 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/126 Safari/537.36',
              'Referer': 'https://sunsetbot.top/detailed/',
              'X-Requested-With': 'XMLHttpRequest',
              'Accept': '*/*',
          }

          now_bjt = datetime.now(ZoneInfo('Asia/Shanghai'))
          event = 'set_2' if now_bjt.hour >= 18 else 'set_1'
          event_label = '明天日落' if event == 'set_2' else '今天日落'
          target_date = (now_bjt.date() + timedelta(days=1)) if event == 'set_2' else now_bjt.date()
          output = {
              'ok': False,
              'generated_at_bjt': now_bjt.isoformat(timespec='seconds'),
              'event_code': event,
              'event_label': event_label,
              'target_date': target_date.isoformat(),
              'source': 'sunsetbot.top/detailed/',
          }

          try:
              city_qid = str(random.randint(1, 9_999_999))
              response = requests.get(
                  base,
                  params={
                      'query_id': city_qid,
                      'intend': 'change_city',
                      'city_name_incomplete': '海淀',
                  },
                  headers=headers,
                  timeout=30,
              )
              response.raise_for_status()
              city_data = response.json()
              matches = [
                  item for item in city_data.get('city_list', [])
                  if '北京' in item and '海淀区' in item
              ]
              if len(matches) != 1:
                  raise RuntimeError(f'Unexpected Haidian matches: {matches!r}')

              city = matches[0]
              output['city'] = city
              output['city_lookup_query_id'] = city_qid
              output['models'] = {}

              for model in ('GFS', 'EC'):
                  query_id = str(random.randint(1, 9_999_999))
                  response = requests.get(
                      base,
                      params={
                          'query_id': query_id,
                          'intend': 'select_city',
                          'query_city': city,
                          'model': model,
                          'event_date': 'None',
                          'event': event,
                          'times': 'None',
                      },
                      headers=headers,
                      timeout=30,
                  )
                  response.raise_for_status()
                  data = response.json()
                  output['models'][model] = {
                      'query_id': data.get('query_id'),
                      'status': data.get('status'),
                      'display_city_name': data.get('display_city_name'),
                      'display_event_name_cn': data.get('display_event_name_cn'),
                      'display_model': data.get('display_model'),
                      'display_times_name': data.get('display_times_name'),
                      'display_times_str': data.get('display_times_str'),
                      'tb_event_time': data.get('tb_event_time'),
                      'tb_quality': data.get('tb_quality'),
                      'tb_aod': data.get('tb_aod'),
                      'local_quality': data.get('local_quality'),
                      'local_aod': data.get('local_aod'),
                      'quality_des': data.get('quality_des'),
                      'aod_des': data.get('aod_des'),
                      'img_href': data.get('img_href'),
                  }

              output['ok'] = True
          except Exception as exc:
              output['error'] = repr(exc)

          # Independent hourly weather context for photographic assessment.
          try:
              forecast_response = requests.get(
                  'https://api.open-meteo.com/v1/forecast',
                  params={
                      'latitude': 39.99,
                      'longitude': 116.31,
                      'hourly': ','.join([
                          'temperature_2m',
                          'relative_humidity_2m',
                          'precipitation_probability',
                          'precipitation',
                          'weather_code',
                          'cloud_cover',
                          'cloud_cover_low',
                          'cloud_cover_mid',
                          'cloud_cover_high',
                          'visibility',
                          'wind_speed_10m',
                          'wind_gusts_10m',
                      ]),
                      'daily': 'sunset',
                      'timezone': 'Asia/Shanghai',
                      'forecast_days': 2,
                  },
                  timeout=30,
              )
              forecast_response.raise_for_status()
              forecast = forecast_response.json()
              hourly = forecast.get('hourly', {})
              times = hourly.get('time', [])
              selected = []
              wanted_prefix = target_date.isoformat()
              for index, time_value in enumerate(times):
                  if not time_value.startswith(wanted_prefix):
                      continue
                  hour = int(time_value[11:13])
                  if hour < 15 or hour > 22:
                      continue
                  row = {'time': time_value}
                  for key, values in hourly.items():
                      if key != 'time' and isinstance(values, list) and index < len(values):
                          row[key] = values[index]
                  selected.append(row)
              daily = forecast.get('daily', {})
              sunset_value = None
              if wanted_prefix in daily.get('time', []):
                  daily_index = daily['time'].index(wanted_prefix)
                  sunsets = daily.get('sunset', [])
                  if daily_index < len(sunsets):
                      sunset_value = sunsets[daily_index]
              output['weather_context'] = {
                  'provider': 'Open-Meteo',
                  'latitude': forecast.get('latitude'),
                  'longitude': forecast.get('longitude'),
                  'timezone': forecast.get('timezone'),
                  'sunset': sunset_value,
                  'hourly_15_22': selected,
              }
          except Exception as exc:
              output['weather_context_error'] = repr(exc)

          try:
              air_response = requests.get(
                  'https://air-quality-api.open-meteo.com/v1/air-quality',
                  params={
                      'latitude': 39.99,
                      'longitude': 116.31,
                      'hourly': 'pm10,pm2_5,european_aqi',
                      'timezone': 'Asia/Shanghai',
                      'forecast_days': 2,
                  },
                  timeout=30,
              )
              air_response.raise_for_status()
              air = air_response.json()
              hourly = air.get('hourly', {})
              times = hourly.get('time', [])
              selected = []
              wanted_prefix = target_date.isoformat()
              for index, time_value in enumerate(times):
                  if not time_value.startswith(wanted_prefix):
                      continue
                  hour = int(time_value[11:13])
                  if hour < 15 or hour > 22:
                      continue
                  row = {'time': time_value}
                  for key, values in hourly.items():
                      if key != 'time' and isinstance(values, list) and index < len(values):
                          row[key] = values[index]
                  selected.append(row)
              output['air_quality_context'] = {
                  'provider': 'Open-Meteo CAMS',
                  'hourly_15_22': selected,
              }
          except Exception as exc:
              output['air_quality_context_error'] = repr(exc)

          with open('sunsetbot_probe_result.json', 'w', encoding='utf-8') as file:
              json.dump(output, file, ensure_ascii=False, indent=2)
          PY
      - name: Commit refreshed result
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add sunsetbot_probe_result.json
          git commit -m 'Refresh SunsetBot Haidian forecast' || exit 0
          git push
